services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-rest:
    image: confluentinc/cp-kafka-rest:7.5.0
    depends_on:
      - kafka
    environment:
      KAFKA_REST_HOST_NAME: kafka-rest
      KAFKA_REST_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      KAFKA_REST_LISTENERS: http://0.0.0.0:8082

  department-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: ./cmd/department-service
    environment:
      PORT: 8081
      KAFKA_REST_URL: http://kafka-rest:8082
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/erp?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      - kafka
      - postgres

  employee-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: ./cmd/employee-service
    environment:
      PORT: 8082
      KAFKA_REST_URL: http://kafka-rest:8082
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/erp?sslmode=disable
    ports:
      - "8082:8082"
    depends_on:
      - kafka
      - postgres

  salary-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: ./cmd/salary-service
    environment:
      PORT: 8083
      KAFKA_REST_URL: http://kafka-rest:8082
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/erp?sslmode=disable
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - postgres

  project-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: ./cmd/project-service
    environment:
      PORT: 8084
      KAFKA_REST_URL: http://kafka-rest:8082
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/erp?sslmode=disable
    ports:
      - "8084:8084"
    depends_on:
      - kafka
      - postgres

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - department-service
      - employee-service
      - salary-service
      - project-service

volumes:
  pgdata:
